name: Build CMF, Push Docker Image to DOCR, Pin tgt-deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  NODE_VERSION: "20"
  DOCTL_VERSION: "1.127.0"
  IMAGE_REPO: "registry.digitalocean.com/qs-ecr/cmf"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: ☑️ Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔨 Build TypeScript
        run: npm run build

      - name: 🧪 Run tests (if available)
        run: npm test --if-present

      - name: 🔍 Lint code
        run: npm run lint --if-present

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      result: ${{ steps.set-output.outputs.result }}
      image_tag: ${{ steps.image_tag.outputs.value }}
    steps:
      - name: ☑️ Checkout code
        uses: actions/checkout@v4

      - name: 🏷️ Compute image tag
        id: image_tag
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: 🔐 Authenticate with DigitalOcean
        uses: ./.github/actions/doctl-auth
        with:
          token: ${{ secrets.DIGITAL_OCEAN_DEPLOY_TOKEN }}
          doctl_version: ${{ env.DOCTL_VERSION }}

      - name: 🐳 Build and Push Docker Image
        uses: ./.github/actions/docker-push
        with:
          repo: ${{ env.IMAGE_REPO }}
          image_tag: ${{ steps.image_tag.outputs.value }}
          do_token: ${{ secrets.DIGITAL_OCEAN_DEPLOY_TOKEN }}

      - name: 📌 Pin image tag in tgt-deployment
        uses: ./.github/actions/bump-deployment-tag
        with:
          deployment_deploy_key: ${{ secrets.TGT_DEPLOYMENT_DEPLOY_KEY }}
          deployment_repo_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          values_file: apps/tgt/cmf-helm/values-prod.yaml
          image_tag: ${{ steps.image_tag.outputs.value }}
          service_name: cmf

      - name: ✅ Mark deploy complete
        id: set-output
        if: success()
        run: echo "result=success" >> "$GITHUB_OUTPUT"

  notify:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: 📣 Notify Discord on Success
        if: needs.build-and-push.result == 'success'
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: "success"
          repo: ${{ github.repository }}
          run_number: ${{ github.run_number }}

      - name: 📣 Notify Discord on Failure
        if: needs.build-and-push.result != 'success'
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: "failure"
          repo: ${{ github.repository }}
          run_number: ${{ github.run_number }}
